[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing: every unmatched path serves the shell, so a refresh on
# /habits or /calendar doesn't 404. Real files are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must never be served stale, or clients pin themselves to
# an old build.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
